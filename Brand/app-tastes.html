<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Izzy — アプリ画面のテイスト比較</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#e8e9eb;color:#242528;font-synthesis:none}button{font:inherit;cursor:pointer;color:inherit}a{color:inherit;text-underline-offset:3px}main{max-width:1470px;padding:28px 24px;margin:auto}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}.intro h1{font-size:24px;letter-spacing:-.03em;margin:0 0 8px}.intro p{font-size:12px;color:#5d6065;margin:0;line-height:1.8}.intro a{font-size:12px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}article{min-width:0}article h2{font-size:15px;margin:0 0 12px}.icon-line{display:flex;align-items:center;gap:12px;margin-bottom:17px}.app-icon{height:62px;width:62px;border-radius:15px;display:grid;place-items:center;overflow:hidden;border:1px solid #0000000c}.mark{display:block;width:56px;height:34px;background:currentColor;mask:url(izzy-wordmark.svg) center/contain no-repeat}.icon-line p{font-size:11px;line-height:1.7;color:#555b61;margin:0}.phone{border-radius:33px;border:1px solid #c8cbd0;overflow:hidden;height:784px;position:relative;background:var(--bg);color:var(--ink);box-shadow:0 8px 25px #2931450a}.screen{display:flex;flex-direction:column;position:relative;isolation:isolate;height:100%;padding:14px 18px 10px}.status{display:flex;justify-content:space-between;align-items:center;height:21px;padding:0 7px;font-size:12px;font-weight:600;margin-bottom:14px}.status .island{position:absolute;top:12px;left:calc(50% - 31px);width:62px;height:17px;background:#16171a;border-radius:20px}.status .connection{display:flex;align-items:center;gap:5px}.battery{display:inline-block;width:20px;height:10px;border:1px solid currentColor;border-radius:3px;position:relative}.battery:before{content:'';position:absolute;left:2px;top:2px;width:13px;height:4px;background:currentColor}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:39px;font-size:13px}.streak{display:flex;align-items:center;gap:5px;font-size:11px}.top-actions{display:flex;align-items:center;gap:12px}.speaking{font-size:11px;display:flex;align-items:center;gap:4px}.glyph{width:19px;height:19px;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.modes{height:35px;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:3px;border-radius:10px;background:var(--surface);font-size:11px;margin:8px 0 0}.modes span{text-align:center;line-height:29px;border-radius:7px}.modes span:first-child{background:var(--selected);color:var(--selected-ink);font-weight:600}.learning{display:flex;flex-direction:column;flex:1;min-height:0}.phrase{padding:33px 0 17px}.category{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 18px}.phrase h3{font-size:43px;letter-spacing:-.035em;line-height:1.08;font-weight:550;margin:0 0 16px}.meaning{font-size:14px;line-height:1.6;margin:0}.parts{display:flex;gap:7px;margin-top:18px}.parts span{font-size:11px;background:var(--surface);padding:7px 13px;border-radius:9px;color:var(--muted)}.tools{display:flex;gap:12px;align-items:center;margin:2px 0 15px}.tools button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:40px;background:transparent;border:0;border-radius:10px;padding:8px 10px;font-size:11px}.tools .listen{background:var(--surface);padding:8px 15px}.tools .save{margin-left:auto;width:40px}.save[aria-pressed=true]{color:var(--accent)}.save[aria-pressed=true] svg{fill:currentColor}.example{border-top:1px solid var(--line);padding:16px 0 0}.example summary{display:flex;align-items:center;justify-content:space-between;font-size:11px;list-style:none;cursor:pointer;min-height:25px;color:var(--muted)}.example summary::-webkit-details-marker{display:none}.example summary:after{content:'+';font-size:16px}.example details[open] summary:after{content:'−'}.sentence{font-size:16px;line-height:1.5;letter-spacing:-.015em;margin:12px 0 7px}.sentence strong{font-weight:650;color:var(--accent)}.translation{font-size:10px;line-height:1.7;color:var(--muted);margin:0}.bottom{margin-top:auto;padding-top:18px}.rating-label{font-size:10px;text-align:center;color:var(--muted);margin:0 0 9px}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ratings button{border:1px solid transparent;border-radius:12px;min-height:60px;background:var(--surface);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:7px 1px;font-size:10px;white-space:nowrap}.ratings button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}.rating-icon{font-size:15px;height:18px}.footerline{display:flex;align-items:center;justify-content:space-between;height:42px;font-size:10px;color:var(--muted)}.arrows{display:flex;gap:19px;align-items:center}.tabs{display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);padding:12px 0 5px;margin:0 -2px}.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9px;color:var(--muted)}.tab.active{color:var(--accent);font-weight:600}.homebar{height:4px;width:90px;background:var(--ink);opacity:.8;margin:10px auto 0;border-radius:3px}.notes{font-size:11px;line-height:1.85;margin-top:14px;color:#565b61}.notes b{display:block;font-size:13px;margin-bottom:5px;color:#272b30}.notes p{margin:0 0 6px}.notes a{font-size:10px}.page-foot{font-size:11px;color:#60656b;border-top:1px solid #c7cbd1;padding-top:15px;margin-top:22px;line-height:1.8}.page-foot p{margin:0}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #6e91eb;outline-offset:3px}button:hover{filter:brightness(.96)}button:active{transform:translateY(1px)}
.native{--bg:#fff;--ink:#262925;--surface:#f0f2ee;--selected:#fff;--selected-ink:#262925;--muted:#676e65;--line:#e1e5de;--accent:#357157}.native .app-icon{background:#ecf0e6;color:#2d533a}.native .phrase h3{font-family:Georgia,serif;font-weight:400}.native .modes span:first-child{box-shadow:0 1px 3px #00000012}.native .ratings button{border-radius:9px}.native .example{padding-top:17px}.native .phrase{padding-top:36px}
.soft{--bg:#f6f5f1;--ink:#263749;--surface:#e8ecef;--selected:#283d55;--selected-ink:#fff;--muted:#657484;--line:#dce1e5;--accent:#375f83}.soft .app-icon{background:#c9e1f4;color:#24405f;border-radius:19px}.soft .modes{background:#e9ebea;border-radius:18px}.soft .modes span{border-radius:16px}.soft .phrase{background:#d9eaf6;border-radius:25px;padding:24px 20px 19px;margin-top:19px}.soft .phrase h3{font-size:39px;letter-spacing:-.04em;font-weight:650}.soft .category{margin-bottom:16px}.soft .parts{margin-top:17px}.soft .parts span{background:#ffffff82;color:#415e74}.soft .tools{margin-top:10px;margin-bottom:10px}.soft .tools .listen{background:#f3dbc9;border-radius:22px}.soft .example{border:0;background:#fff;border-radius:21px;padding:14px 17px}.soft .sentence{font-size:15px}.soft .ratings button{border-radius:15px}.soft .ratings button:nth-child(1){background:#f3e2dc}.soft .ratings button:nth-child(2){background:#f1e8d7}.soft .ratings button:nth-child(3){background:#dce9df}.soft .ratings button:nth-child(4){background:#dbe5f0}.soft .tabs{border-top:0;background:#fff;border-radius:20px;padding-top:10px}
.tactile{--bg:#19191b;--ink:#f5f5f0;--surface:#2b2b2e;--selected:#f7cf5a;--selected-ink:#171719;--muted:#a9a9b0;--line:#363639;--accent:#f7cf5a}.tactile .app-icon{background:#18181a;color:#f7cf5a}.tactile .modes{border-radius:7px;border:1px solid #38383c;background:#111113}.tactile .modes span{border-radius:4px;line-height:27px}.tactile .phrase{padding-top:31px}.tactile .phrase h3{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:750;font-size:50px;letter-spacing:-.055em;margin-bottom:15px}.tactile .category{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.06em}.tactile .parts span{border:1px solid #404046;border-radius:5px;background:transparent}.tactile .tools .listen{background:linear-gradient(#f8f8f3,#d3d3cf);color:#19191b;box-shadow:0 3px 0 #999995,0 5px 8px #0005;border-radius:8px;min-width:128px}.tactile .tools{margin-bottom:21px}.tactile .ratings button{border:1px solid #414146;border-radius:7px;box-shadow:0 3px 0 #0b0b0d;background:linear-gradient(#323235,#262628)}.tactile .rating-icon{color:#f7cf5a}.tactile .ratings button[aria-pressed=true]{border-color:#f7cf5a;box-shadow:0 0 0 1px #f7cf5a inset}.tactile .footerline{font-family:ui-monospace,monospace}
.immersive{--bg:#172638;--ink:#eff5ff;--surface:#ffffff13;--selected:#d1e8fd;--selected-ink:#183249;--muted:#b2c7dd;--line:#ffffff20;--accent:#c3e4ff}.immersive .app-icon{background:linear-gradient(140deg,#16344b,#608aa1);color:#fff}.immersive .screen:before{content:'';position:absolute;inset:0;z-index:-1;background:linear-gradient(#142539ee 0%,#152b42de 37%,#16324cdd 67%,#122338fc 100%),url('../Izzy/Resources/Assets.xcassets/TodayMountains.imageset/today-mountains.jpg') center/cover no-repeat}.immersive .modes{border:1px solid #ffffff13;border-radius:19px}.immersive .modes span{border-radius:16px;line-height:27px}.immersive .phrase{padding-top:36px;text-align:center}.immersive .phrase h3{font-family:Georgia,serif;font-weight:400;font-size:43px}.immersive .parts{justify-content:center}.immersive .parts span{border:1px solid #ffffff18;border-radius:15px;background:#ffffff0b}.immersive .tools{justify-content:center}.immersive .tools .save{margin-left:0}.immersive .tools .listen{border:1px solid #ffffff24;border-radius:22px;background:#ffffff14}.immersive .example{padding:15px 15px 13px;background:#132d45c9;border:1px solid #ffffff22;border-radius:19px;box-shadow:0 9px 18px #0001}.immersive .sentence{font-size:15px}.immersive .ratings button{border:1px solid #ffffff20;background:#ffffff12;border-radius:14px}.immersive .tabs{background:#10243580;border:1px solid #ffffff15;border-radius:22px;padding-top:9px}.immersive .tab.active{color:#fff}
@media(max-width:1140px){main{max-width:820px}.grid{grid-template-columns:1fr 1fr;gap:30px}.phone{height:800px}.intro{display:block}.intro>a{display:inline-block;margin-top:10px}}
@media(max-width:600px){main{padding:24px 18px;max-width:440px}.grid{grid-template-columns:1fr;gap:28px}.phone{height:800px}.intro h1{font-size:22px}}
</style>
<main><header class="intro"><div><h1>Izzy の「アプリ画面」で比べる。</h1><p>同じ表現・意味・例文・復習操作。文字、面の分け方、ボタン、配色を変えた4案。</p></div><a href="APP-TASTES.md">参照と設計の意図 ↗</a></header><section class="grid" id="grid" aria-label="アプリ画面の4案"></section><footer class="page-foot"><p>アプリ内の学習画面とアイコンの外観試作。正式な iOS 実装ではありません。例文の開閉、保存マーク、評価の選択、読み上げを比較用に操作できます。<br>学習記録は保存されません。設定・タブ・画面移動は見た目の見本です。</p><p id="audio-status" role="status"></p></footer></main>
<script>
const shapes={settings:'<path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 3v6m8 0v6M9 15v6"/>',volume:'<path d="M4 9h4l5-4v14l-5-4H4zM17 8q4 4 0 8m3-11q6 7 0 14"/>',bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',home:'<path d="M3 11l9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/>',stack:'<rect x="6" y="6" width="14" height="15" rx="3"/><path d="M16 3H6a3 3 0 0 0-3 3v10"/>',chart:'<path d="M4 3v18h17M7 15l4-5 4 3 5-8"/>',mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/>',flame:'<path d="M12 2c1 5 6 7 6 12a6 6 0 0 1-12 0c0-3 2-5 3-7 0 4 2 4 3 5 2-3 1-6 0-10z"/>'};
const icon=n=>`<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">${shapes[n]}</svg>`;
const data=[{theme:'native',title:'1. 文字中心・すっきり',words:'白い面、細い区切り<br>緑のアクセント',lead:'読むことに集中できる。',body:'カードを増やさず、表現と例文を文字の大小で整理。必要な操作を薄い面にまとめる。',ref:'Granola',url:'https://wellmade.fyi/app/granola/209'},{theme:'soft',title:'2. 柔らかいカード',words:'淡いブルー、丸い面<br>親しみやすいボタン',lead:'気負わず、毎日開ける。',body:'表現と例文を柔らかなカードに分ける。色と余白で読み進める順序を伝える。',ref:'Headspace',url:'https://wellmade.fyi/@headspace/47'},{theme:'tactile',title:'3. 白黒・触感のある操作',words:'大きい文字、浅い立体<br>白黒＋少量の黄色',lead:'押す、聴く、覚える感触。',body:'重要な言葉を大きく。音声や評価のボタンには、操作する場所が分かる厚みを持たせる。',ref:'(Not Boring) Habits',url:'https://wellmade.fyi/app/not-boring-habits/435'},{theme:'immersive',title:'4. 暗色・静かな奥行き',words:'濃いブルー、透ける面<br>控えめな風景',lead:'一つの表現に、静かに向き合う。',body:'背景は薄く、例文の下には安定した暗い面。奥行きと読みやすさを両立する。',ref:'Opal',url:'https://wellmade.fyi/app/opal/441'}];
document.getElementById('grid').innerHTML=data.map((d,i)=>`<article class="${d.theme}"><h2>${d.title}</h2><div class="icon-line"><div class="app-icon"><span class="mark" role="img" aria-label="${d.title}のIzzyアイコン"></span></div><p>${d.words}</p></div><div class="phone"><div class="screen"><div class="status" aria-hidden="true"><span>9:41</span><span class="island"></span><span class="connection">▮▮▮ <span class="battery"></span></span></div><div class="topbar"><span class="streak">${icon('flame')} 3日</span><div class="top-actions"><span class="speaking">${icon('mic')} 発話練習</span>${icon('settings')}</div></div><div class="modes"><span>今日の学習</span><span>探索</span></div><div class="learning"><div class="phrase"><p class="category">Meetings &amp; ideas</p><h3>bring up</h3><p class="meaning">話題を切り出す。</p><div class="parts"><span>bring</span><span>up</span></div></div><div class="tools"><button class="listen" type="button" aria-label="bring upの発音を聴く">${icon('volume')} 発音を聴く</button><button class="save" type="button" aria-label="表現を保存" aria-pressed="false">${icon('bookmark')}</button></div><div class="example"><details open><summary>例文</summary><p class="sentence">Before we finish, can I <strong>bring up</strong> the deadline?</p><p class="translation">終わる前に、締め切りの話をしてもいい？</p></details></div><div class="bottom"><p class="rating-label">どのくらい思い出せましたか？</p><div class="ratings" role="group" aria-label="${d.title}の復習評価">${[['↻','もう一度'],['−','難しい'],['✓','良い'],['ϟ','簡単']].map(([symbol,t])=>`<button type="button" aria-pressed="false"><span class="rating-icon" aria-hidden="true">${symbol}</span>${t}</button>`).join('')}</div><div class="footerline"><span>新しい表現 2 / 5</span><span class="arrows">‹ <span>1 / 5</span> ›</span></div></div></div><div class="tabs"><span class="tab active">${icon('home')}ホーム</span><span class="tab">${icon('stack')}表現</span><span class="tab">${icon('chart')}記録</span></div><div class="homebar" aria-hidden="true"></div></div></div><div class="notes"><b>${d.lead}</b><p>${d.body}</p><a href="${d.url}">画面の参照：${d.ref} ↗</a></div></article>`).join('');
document.querySelectorAll('.save').forEach(b=>b.addEventListener('click',()=>{const saved=b.getAttribute('aria-pressed')==='true';b.setAttribute('aria-pressed',String(!saved));b.setAttribute('aria-label',saved?'表現を保存':'保存を解除')}));
document.querySelectorAll('.ratings button').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
document.querySelectorAll('.listen').forEach(b=>b.addEventListener('click',()=>{const s=document.getElementById('audio-status');if(!('speechSynthesis' in window)){s.textContent='このブラウザーでは読み上げを利用できません。';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('bring up');u.lang='en-US';u.rate=.85;u.onerror=()=>{s.textContent='読み上げを開始できませんでした。';};u.onend=()=>{s.textContent='';};speechSynthesis.speak(u)}));
window.addEventListener('pagehide',()=>{if('speechSynthesis' in window)speechSynthesis.cancel()});
</script>
</html>
