name: Izzy
options:
  bundleIdPrefix: me.unvalley
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  knownRegions: [en, ja]
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: 28
targets:
  Izzy:
    type: application
    platform: iOS
    sources:
      # The .icon document is one file to Xcode, so it is listed on its own
      # instead of being walked into by the folder scan.
      - path: Izzy
        excludes: [Resources/Izzy.icon]
      - path: Izzy/Resources/Izzy.icon
        type: file
    dependencies:
      - target: IzzyWidget
    settings:
      base:
        INFOPLIST_FILE: Izzy/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: me.unvalley.izzy
        CODE_SIGN_ENTITLEMENTS: Configuration/Izzy.entitlements
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ASSETCATALOG_COMPILER_APPICON_NAME: Izzy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Izzy
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  IzzyWidget:
    type: app-extension
    platform: iOS
    sources:
      # Core is Foundation-only and carries the snapshot the widget reads; the design tokens keep
      # its colors and type the same as the app's.
      - path: IzzyWidget
      - path: Izzy/Core
      - path: Izzy/Views/DesignTokens.swift
    settings:
      base:
        INFOPLIST_FILE: IzzyWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: me.unvalley.izzy.widget
        CODE_SIGN_ENTITLEMENTS: Configuration/IzzyWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Izzy
        SKIP_INSTALL: YES
  IzzyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [IzzyTests]
    dependencies: [{target: Izzy}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  IzzyStoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IzzyStoreTests
      - path: Configuration/Izzy.storekit
        buildPhase: resources
    dependencies: [{target: Izzy}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  IzzyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - IzzyUITests
      - path: Configuration/Izzy.storekit
        buildPhase: resources
    dependencies: [{target: Izzy}]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  IzzyPerformance:
    build:
      targets:
        Izzy: all
    test:
      config: Release
      targets:
        - name: IzzyUITests
          selectedTests: [SwipePerformanceTests]
  Izzy:
    build:
      targets:
        Izzy: all
    test:
      targets: [IzzyTests, IzzyUITests]
  IzzyStore:
    build:
      targets:
        Izzy: all
    run:
      config: Debug
      storeKitConfiguration: Configuration/Izzy.storekit
    test:
      targets: [IzzyTests, IzzyStoreTests, IzzyUITests]
      storeKitConfiguration: Configuration/Izzy.storekit
